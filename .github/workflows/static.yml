name: Deploy static content to Pages

# PUSH != DEPLOY. Dispatch identifies the exact current release-branch HEAD.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character SHA approved for release (current casillas-2.0 HEAD)
        required: true
        type: string
      approval_record:
        description: Reference to Igor's explicit approval of this SHA and rollback plan
        required: true
        type: string
      smoke_record:
        description: Reference to candidate smoke/Auth/PWA/cache evidence for this SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  APPROVAL_RECORD: ${{ inputs.approval_record }}
  SMOKE_RECORD: ${{ inputs.smoke_record }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Reject wrong event, ref, SHA or release-branch HEAD
        id: guard
        run: node .github/scripts/production-gate.mjs release-check

  validation:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [preflight, validation]
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.artifact.outputs.sha }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      digest: ${{ steps.artifact.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Build and smoke-check the artifact from the validated SHA
        id: artifact
        run: node .github/scripts/production-gate.mjs build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ./_site
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/casillas-2.0' && needs.build.outputs.sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Recheck approved SHA after environment approval
        run: node .github/scripts/production-gate.mjs release-check
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy only this run's validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
