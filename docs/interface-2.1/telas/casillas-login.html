<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casillas · Entrar</title>
<style>
:root{--bg:#0b1118;--card:#111b27;--card2:#16232f;--line:#24364a;--tx:#eef3f8;--mut:#93a4b6;--or:#ff7a1a;--bl:#4aa3ff;--ok:#6fd3a6;--okbg:#0f2a22;--okline:#2a6a52;--bad:#ff8a80;--badbg:#2a1414;--badline:#7a2b2b;--warn:#3a2a10;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:420px;margin:0 auto;padding:2rem 1.25rem;display:grid;gap:1.25rem}
.brand{display:flex;align-items:center;gap:.75rem}
.brand b{font-size:1.75rem;letter-spacing:.3px}
svg.logo{width:40px;height:40px;color:var(--or);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.i{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:1.75rem;margin:0}
.sub{color:var(--mut);margin:.25rem 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{min-height:48px;border-radius:10px;border:0;background:none;color:var(--mut);font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer}
.tab[aria-selected=true]{background:var(--or);color:#1a0d00}
form{display:grid;gap:1rem}
label{display:grid;gap:.375rem;font-weight:600}
.fld{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:52px}
.fld:focus-within{border-color:var(--bl)}
.fld.err{border-color:var(--badline)}
.fld input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;padding:.75rem .875rem;outline:none;min-height:50px}
.eye{background:none;border:0;color:var(--mut);min-width:48px;min-height:48px;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.hint{font-size:.875rem;color:var(--mut);margin:0;font-weight:400}
.msg{font-size:.875rem;color:var(--bad);margin:0;font-weight:400}
.alert{display:flex;gap:.75rem;align-items:flex-start;border-radius:12px;padding:.75rem;font-size:.9375rem}
.alert svg{margin-top:2px}
.alert.bad{background:var(--badbg);border:1px solid var(--badline);color:var(--bad)}
.alert.off{background:var(--warn);border:1px solid #7a5316;color:#ffb35c}
.alert.ok{background:var(--okbg);border:1px solid var(--okline);color:var(--ok)}
.alert.info{background:#0f2236;border:1px solid #1f4a78;color:var(--bl)}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--or);background:var(--or);color:#1a0d00;font-family:inherit;font-weight:700;font-size:1.0625rem;cursor:pointer;width:100%}
.btn[disabled]{opacity:.7;cursor:progress}
.link{background:none;border:0;color:var(--bl);font-family:inherit;font-weight:600;font-size:1rem;min-height:48px;padding:0 .5rem;cursor:pointer}
.right{display:flex;justify-content:flex-end}
.note{color:var(--mut);font-size:.875rem;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2l1.5 2.5 3-.5 1 2.8 2.7 1.4-.8 3 .8 3-2.7 1.4-1 2.8-3-.5L12 22l-1.5-2.5-3 .5-1-2.8-2.7-1.4.8-3-.8-3 2.7-1.4 1-2.8 3 .5z"/></svg><b>Casillas</b></div>
  <div><h1 id="h">Entrar</h1><p class="sub" id="sub">Acesse seu Casillas com e-mail e senha.</p></div>

  <div class="tabs" role="tablist" aria-label="Acesso">
    <button class="tab" id="t-in" type="button" role="tab" aria-selected="true">Entrar</button>
    <button class="tab" id="t-up" type="button" role="tab" aria-selected="false">Criar conta</button>
  </div>

  <div class="alert off" id="off" role="status" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><span>Sem internet. Conecte-se para continuar.</span></div>
  <div class="alert" id="al" role="alert" hidden><svg class="i" id="alico" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="alt"></span></div>

  <form id="f" novalidate>
    <label>E-mail
      <div class="fld" id="fe"><input id="e" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="seu@email.com"></div>
    </label>
    <label>Senha
      <div class="fld" id="fp"><input id="p" type="password" autocomplete="current-password" placeholder="Sua senha"><button class="eye" type="button" id="eye" aria-label="Mostrar senha" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <p class="hint" id="ph" hidden>Use pelo menos 6 caracteres.</p>
    </label>
    <div class="right" id="forgot"><button class="link" type="button" id="fg">Esqueci a senha</button></div>
    <button class="btn" type="submit" id="go">Entrar</button>
  </form>

  <p class="note" id="nt" hidden>Ao criar a conta, você recebe uma mensagem no e-mail cadastrado para confirmar o cadastro.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const ICO={bad:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
let mode="in",busy=false;
function alertMsg(kind,text){const a=$("#al");if(!text){a.hidden=true;return}a.className="alert "+kind;$("#alico").innerHTML=ICO[kind];$("#alt").textContent=text;a.hidden=false}
function setMode(m){mode=m;const up=m==="up";
 $("#t-in").setAttribute("aria-selected",!up);$("#t-up").setAttribute("aria-selected",up);
 $("#h").textContent=up?"Criar conta":"Entrar";
 $("#sub").textContent=up?"Cadastre e-mail e senha para criar sua conta de teste.":"Acesse seu Casillas com e-mail e senha.";
 $("#go").textContent=up?"Criar conta":"Entrar";
 $("#forgot").hidden=up;$("#ph").hidden=!up;$("#nt").hidden=!up;
 $("#p").autocomplete=up?"new-password":"current-password";
 alertMsg("",""); $("#fe").classList.remove("err");$("#fp").classList.remove("err")}
function net(){$("#off").hidden=navigator.onLine!==false}
addEventListener("online",net);addEventListener("offline",net);net();
$("#t-in").addEventListener("click",()=>setMode("in"));$("#t-up").addEventListener("click",()=>setMode("up"));
$("#eye").addEventListener("click",()=>{const p=$("#p"),on=p.type==="password";p.type=on?"text":"password";$("#eye").setAttribute("aria-pressed",on);$("#eye").setAttribute("aria-label",on?"Ocultar senha":"Mostrar senha")});
function wait(label,done){const b=$("#go"),old=b.textContent;busy=true;b.disabled=true;b.textContent="Aguarde...";setTimeout(()=>{busy=false;b.disabled=false;b.textContent=old;done()},900)}
$("#fg").addEventListener("click",()=>{
 if(!$("#e").value.trim()){$("#fe").classList.add("err");alertMsg("bad","Informe seu e-mail para recuperar a senha.");return}
 $("#fe").classList.remove("err");alertMsg("info","Enviando instruções...");
 setTimeout(()=>alertMsg("ok","Verifique seu e-mail para redefinir a senha."),900)});
$("#f").addEventListener("submit",e=>{
 e.preventDefault();if(busy)return;
 const ev=$("#e").value.trim(),pv=$("#p").value;
 $("#fe").classList.toggle("err",!ev);$("#fp").classList.toggle("err",!pv);
 if(!ev||!pv){alertMsg("bad","Informe seu e-mail e sua senha.");return}
 if(pv.length<6){$("#fp").classList.add("err");alertMsg("bad","A senha deve ter pelo menos 6 caracteres.");return}
 if(navigator.onLine===false){net();return}
 alertMsg("","");
 // Demonstração: nenhum servidor é consultado. O app real valida no Supabase.
 wait("",()=>{if(mode==="up")alertMsg("ok","Conta criada. Verifique seu e-mail para confirmar o cadastro.");else alertMsg("bad","E-mail ou senha incorretos. Confira e tente de novo.")});
});
</script>
</body>
</html>
