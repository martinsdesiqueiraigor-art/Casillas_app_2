<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casillas · Conicidade</title>
<style>
:root{--bg:#0b1118;--card:#111b27;--card2:#16232f;--line:#24364a;--tx:#eef3f8;--mut:#93a4b6;--or:#ff7a1a;--bl:#4aa3ff;--ok:#6fd3a6;--okbg:#0f2a22;--okline:#2a6a52;--bad:#ff8a80;--badbg:#2a1414;--badline:#7a2b2b;--wn:#ffb35c;--wnbg:#3a2a10;--wnline:#7a5316;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto;padding:.75rem 1rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
.top{display:flex;align-items:center;gap:.25rem}
.top h1{font-size:1.5rem;margin:0;flex:1}
.iconbtn{background:none;border:0;color:var(--tx);min-width:48px;min-height:48px;display:grid;place-items:center;border-radius:12px;cursor:pointer}
svg.i{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-flex;align-items:center;gap:.375rem;border:1px solid var(--wnline);background:var(--wnbg);color:var(--wn);border-radius:20px;padding:.25rem .75rem;font-weight:600;font-size:.875rem;justify-self:start}
.badge svg{width:16px;height:16px}
.sub{color:var(--mut);margin:0;font-size:.9375rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.375rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.25rem}
.tab{min-height:48px;border-radius:10px;border:0;background:none;color:var(--mut);font-family:inherit;font-weight:600;font-size:.9375rem;cursor:pointer}
.tab[aria-selected=true]{background:#0f2236;color:var(--bl);box-shadow:inset 0 0 0 1px #1f4a78}
.fig{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.5rem}
.fig svg{width:100%;height:auto;display:block}
.fig text{fill:var(--tx);font:600 13px "Segoe UI",Roboto,sans-serif}
.fig .dim{stroke:var(--bl);stroke-width:1.5;fill:none}
.fig .body{fill:#16232f;stroke:var(--or);stroke-width:2.5;stroke-linejoin:round}
.fig .ax{stroke:var(--mut);stroke-width:1;stroke-dasharray:6 4}
form{display:grid;gap:.75rem}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
label{display:grid;min-width:0;gap:.375rem;font-weight:600;font-size:.9375rem}
.fld{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:52px}
.fld:focus-within{border-color:var(--bl)}
.fld.err{border-color:var(--badline)}
.fld input{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--tx);font:inherit;font-size:1.125rem;padding:.5rem .75rem;outline:none;min-height:50px}
.fld .u{color:var(--mut);padding-right:.75rem;font-weight:600}
.pre{color:var(--mut);padding-left:.75rem;font-weight:700}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--or);background:var(--or);color:#1a0d00;font-family:inherit;font-weight:700;font-size:1.0625rem;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem}
.btn.out{background:none;color:var(--tx);border-color:var(--line);font-weight:600;min-height:48px}
.alert{display:flex;gap:.75rem;align-items:flex-start;border-radius:12px;padding:.75rem;font-size:.9375rem;background:var(--badbg);border:1px solid var(--badline);color:var(--bad)}
.alert svg{margin-top:2px}
.res{background:var(--card);border:1px solid var(--okline);border-radius:16px;padding:.875rem;display:grid;gap:.75rem}
.res h2{margin:0;font-size:.875rem;color:var(--ok);display:flex;align-items:center;gap:.375rem}
.res h2 svg{width:18px;height:18px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.625rem}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.625rem .75rem;display:grid;gap:.125rem}
.kpi small{color:var(--mut);font-size:.875rem}
.kpi b{font-size:1.5rem}
.kpi.main{grid-column:1/-1;border-color:var(--okline);background:var(--okbg)}
.kpi b span{font-size:1rem;color:var(--mut);font-weight:600}
details.dt{border:1px solid var(--line);border-radius:12px;background:var(--card2)}
details.dt summary{min-height:48px;display:flex;align-items:center;padding:0 .75rem;font-weight:600;cursor:pointer}
.rw{display:flex;justify-content:space-between;gap:.75rem;padding:.625rem .75rem;border-top:1px solid var(--line);font-size:.9375rem}
.rw span{color:var(--mut)}
.rw b{text-align:right}
.note{color:var(--mut);font-size:.8125rem;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#0d1620;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:.5rem .25rem;color:var(--mut);font-size:.8125rem;text-decoration:none;border-top:3px solid transparent;min-height:56px}
nav a[aria-current]{color:var(--or);border-color:var(--or)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="iconbtn" type="button" aria-label="Voltar"><i data-ic="back"></i></button>
    <h1>Conicidade</h1>
    <button class="iconbtn" type="button" aria-label="Configurações" style="color:var(--mut)"><i data-ic="cog"></i></button>
  </div>
  <span class="badge"><i data-ic="warn" style="display:contents"></i>Em revisão técnica</span>
  <p class="sub" id="sub"></p>

  <div class="tabs" role="tablist" aria-label="Modo de cálculo">
    <button class="tab" role="tab" type="button" data-m="dl" aria-selected="true">D · d · L</button>
    <button class="tab" role="tab" type="button" data-m="ang" aria-selected="false">Ângulo</button>
    <button class="tab" role="tab" type="button" data-m="inc" aria-selected="false">Inclinação</button>
  </div>

  <div class="fig" aria-label="Figura do cone com as cotas D, d e L">
    <svg viewBox="0 0 340 170" role="img" aria-label="Cone com diâmetro maior D, diâmetro menor d e comprimento L">
      <line class="ax" x1="20" y1="85" x2="300" y2="85"/>
      <polygon class="body" id="cone" points="70,35 250,60 250,110 70,135"/>
      <line class="dim" x1="56" y1="35" x2="56" y2="135"/><path class="dim" d="M52 41l4-6 4 6M52 129l4 6 4-6"/>
      <text x="4" y="90" id="fD" style="paint-order:stroke;stroke:#111b27;stroke-width:4px">D</text>
      <line class="dim" x1="272" y1="60" x2="272" y2="110"/><path class="dim" d="M268 66l4-6 4 6M268 104l4 6 4-6"/>
      <text x="282" y="90" id="fd" style="paint-order:stroke;stroke:#111b27;stroke-width:4px">d</text>
      <line class="dim" x1="70" y1="152" x2="250" y2="152"/><path class="dim" d="M76 148l-6 4 6 4M244 148l6 4-6 4"/>
      <text x="160" y="167" text-anchor="middle" id="fL">L</text>
    </svg>
  </div>

  <form id="f" novalidate onsubmit="return false"></form>
  <div class="alert" id="al" role="alert" hidden><i data-ic="warn" style="display:contents"></i><span id="alt"></span></div>

  <section class="res" id="res" aria-live="polite" hidden>
    <h2><i data-ic="ok" style="display:contents"></i>Resultados</h2>
    <div id="out"></div>
    <button class="btn out" type="button" id="cp"><i data-ic="copy" style="display:contents"></i><span id="cpt">Copiar resultado</span></button>
    <p class="note">Cálculo de demonstração, em revisão técnica. Confira com o desenho da peça.</p>
  </section>
</main>
<nav aria-label="Navegação principal">
  <a href="#"><i data-ic="home" style="display:contents"></i>Início</a>
  <a href="#" aria-current="page"><i data-ic="calc" style="display:contents"></i>Calculadoras</a>
  <a href="#"><i data-ic="book" style="display:contents"></i>Guia CNC</a>
  <a href="#"><i data-ic="lib" style="display:contents"></i>Biblioteca</a>
</nav>
<script>
const ICONS={
 back:'<path d="M15 6l-6 6 6 6"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2l1.5 2.5 3-.5 1 2.8 2.7 1.4-.8 3 .8 3-2.7 1.4-1 2.8-3-.5L12 22l-1.5-2.5-3 .5-1-2.8-2.7-1.4.8-3-.8-3 2.7-1.4 1-2.8 3 .5z"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
 book:'<path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1zM21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/>',
 lib:'<path d="M5 4v16M10 4v16M14 6l4 14M5 4h5"/>'
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll("[data-ic]").forEach(e=>{e.innerHTML=ico(e.dataset.ic).replace('class="i"','class="i"');});
const $=s=>document.querySelector(s);
const MODES={
 dl:{sub:"Informe os dois diâmetros e o comprimento do cone.",f:[["D","Diâmetro maior (D)","mm","50"],["d","Diâmetro menor (d)","mm","40"],["L","Comprimento (L)","mm","100"]]},
 ang:{sub:"Informe D, L e o ângulo total para achar o diâmetro menor.",f:[["D","Diâmetro maior (D)","mm","50"],["L","Comprimento (L)","mm","100"],["A","Ângulo total","°","5,725"]]},
 inc:{sub:"Informe D, L e a conicidade 1:X para achar o diâmetro menor.",f:[["D","Diâmetro maior (D)","mm","50"],["L","Comprimento (L)","mm","100"],["X","Conicidade 1 : X","","10"]]}
};
let mode="dl",last="";const saved={};
const num=v=>{const s=String(v).trim().replace(",",".");return s===""?NaN:Number(s)};
const fmt=(n,d)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const trim=t=>t.replace(/,0+$/,"").replace(/(,\d*?)0+$/,"$1");
const f3=n=>trim(fmt(n,3));
function fld([k,l,u,dv]){const val=(saved[mode]||{})[k]??dv;return `<label>${l}<span class="fld" id="w${k}">${k==="X"?'<span class="pre">1 :</span>':""}<input id="i${k}" inputmode="decimal" autocomplete="off" value="${val}"><span class="u">${u}</span></span></label>`}
function build(){
 const M=MODES[mode];$("#sub").textContent=M.sub;
 $("#f").innerHTML=`<div class="row">${M.f.slice(0,2).map(fld).join("")}</div>${fld(M.f[2])}`;
 $("#f").querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{(saved[mode]=saved[mode]||{})[i.id.slice(1)]=i.value;calc()}));
 calc();
}
function figure(D,d,L,ok){
 const hl=70,hs=ok?70*d/D:50;
 $("#cone").setAttribute("points",`70,${85-hl/2} 250,${85-hs/2} 250,${85+hs/2} 70,${85+hl/2}`);
 $("#fD").textContent=isNaN(D)?"D":"D = "+f3(D);$("#fd").textContent=isNaN(d)?"d":"d = "+f3(d);$("#fL").textContent=isNaN(L)?"L":"L = "+f3(L);
}
function fail(msg,ids){$("#al").hidden=false;$("#alt").textContent=msg;$("#res").hidden=true;last="";(ids||[]).forEach(k=>$("#w"+k).classList.add("err"))}
function calc(){
 $("#al").hidden=true;document.querySelectorAll(".fld").forEach(x=>x.classList.remove("err"));
 const M=MODES[mode];const v={};const empty=[];
 M.f.forEach(([k])=>{v[k]=num($("#i"+k).value);if(isNaN(v[k]))empty.push(k)});
 let D=v.D,d=v.d,L=v.L;
 if(empty.length){figure(D,d,L,false);$("#res").hidden=true;last="";return}
 const neg=M.f.map(f=>f[0]).filter(k=>v[k]<=0&&!(mode==="dl"&&k==="d"&&v[k]===0));
 if(neg.length){figure(D,d,L,false);return fail("Use valores maiores que zero.",neg)}
 if(mode==="dl"){if(d>=D){figure(D,d,L,false);return fail("O diâmetro menor (d) deve ser menor que o maior (D).",["D","d"])}}
 else if(mode==="ang"){if(v.A>=180){figure(D,NaN,L,false);return fail("O ângulo total deve ser menor que 180°.",["A"])}d=D-2*L*Math.tan(v.A/2*Math.PI/180);if(d<=0){figure(D,NaN,L,false);return fail("Com esse ângulo o diâmetro menor ficaria zero ou negativo. Reduza L ou o ângulo.",["L","A"])}}
 else{d=D-L/v.X;if(d<=0){figure(D,NaN,L,false);return fail("Com essa conicidade o diâmetro menor ficaria zero ou negativo. Reduza L ou aumente X.",["L","X"])}}
 const half=Math.atan((D-d)/(2*L))*180/Math.PI,A=2*half,ratio=(D-d)>0?"1:"+trim(fmt(L/(D-d),2)):"—";
 figure(D,d,L,true);
 const kp=(l,val,u,c)=>`<div class="kpi ${c||""}"><small>${l}</small><b>${val}${u?` <span>${u}</span>`:""}</b></div>`;
 const rw=(l,val)=>`<div class="rw"><span>${l}</span><b>${val}</b></div>`;
 const det=[["Semi-ângulo",fmt(half,4)+"°"],["Diferença D − d",f3(D-d)+" mm"],["Inclinação i = (D − d) / 2L",fmt((D-d)/(2*L),4)]];
 $("#out").innerHTML=`<div class="kpis">${mode!=="dl"?kp("Diâmetro menor (d)",f3(d),"mm","main"):""}${kp("Conicidade",ratio)}${kp("Ângulo total",fmt(A,3),"°")}</div><details class="dt" open><summary>Resultados detalhados</summary>${det.map(r=>rw(r[0],r[1])).join("")}</details>`;
 last="Conicidade (D "+f3(D)+", d "+f3(d)+", L "+f3(L)+")\n"+(mode!=="dl"?"Diâmetro menor (d): "+f3(d)+" mm\n":"")+"Conicidade: "+ratio+"\nÂngulo total: "+fmt(A,3)+"°\n"+det.map(r=>r[0]+": "+r[1]).join("\n");
 $("#res").hidden=false;
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{mode=t.dataset.m;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));build()}));
$("#cp").addEventListener("click",async()=>{
 if(!last)return;let ok=false;try{await navigator.clipboard.writeText(last);ok=true}catch(e){try{const t=document.createElement("textarea");t.value=last;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(_){}}
 $("#cpt").textContent=ok?"Copiado":"Não foi possível copiar";setTimeout(()=>$("#cpt").textContent="Copiar resultado",1800);
});
build();
</script>
</body>
</html>
